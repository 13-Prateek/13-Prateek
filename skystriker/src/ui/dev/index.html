<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skystriker · HUD + audio test bench</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; cursor: crosshair; }
      #app canvas { width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #bench { position: fixed; left: 8px; bottom: 8px; max-width: 760px; padding: 8px 10px; border-radius: 8px;
        background: rgba(12, 16, 34, .88); border: 1px solid #2b3a67; color: #cfe3ff; font-size: 12px; z-index: 10; }
      #bench.hidden { display: none; }
      #bench h4 { margin: 4px 0 3px; font-size: 11px; letter-spacing: 1px; color: #7f95c8; text-transform: uppercase; }
      #bench button { margin: 2px; padding: 3px 7px; font-size: 12px; background: #1b2550; color: #e8f1ff; border: 1px solid #3a4c8c;
        border-radius: 4px; cursor: pointer; }
      #bench button:hover { background: #2a3a7a; }
      #bench .row { display: flex; flex-wrap: wrap; align-items: center; }
      #inputview { font: 11px ui-monospace, monospace; color: #9fb4dd; white-space: pre; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="bench"></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
